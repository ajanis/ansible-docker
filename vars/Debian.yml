---
docker_dependency_pkgs:
  - gcc
  - python{{ ansible_facts['python']['version']['major'] }}-dev
  - python{{ ansible_facts['python']['version']['major'] }}-pip
  - python{{ ansible_facts['python']['version']['major'] }}-docker
  - python{{ ansible_facts['python']['version']['major'] }}-dockerpycreds
  - python{{ ansible_facts['python']['version']['major'] }}-dockerpty
  - python{{ ansible_facts['python']['version']['major'] }}-debian
  - build-essential
  - libffi-dev

docker_io_pkgs:
  - docker.io
  - containerd
  - docker-compose-v2
  - docker-buildx

docker_ce_pkgs:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - python{{ ansible_facts['python']['version']['major'] }}-requests
  - python{{ ansible_facts['python']['version']['major'] }}-docker

docker_nvidia_driver_dependencies:
  - gcc
  - binutils
  - make
  - linux-source
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg-agent
  - software-properties-common
  - jq

docker_nvidia_driver_packages:
  - "nvidia-headless-{{ docker_nvidia_driver_version }}"
  - "libnvidia-encode-{{ docker_nvidia_driver_version }}"
  - "libnvidia-decode-{{ docker_nvidia_driver_version }}"
  - "libnvidia-compute-{{ docker_nvidia_driver_version }}"
  - "nvidia-utils-{{ docker_nvidia_driver_version }}"
  - "nvidia-kernel-common-{{ docker_nvidia_driver_version }}"
  - "nvidia-kernel-source-{{ docker_nvidia_driver_version }}"

docker_nvidia_cuda_packages:
  - "{{ docker_nvidia_cudnn_package }}"

docker_nvidia_docker_packages:
  - libnvidia-container-tools
  - libnvidia-container1
  - nvidia-container-toolkit
  - nvidia-docker2
  - nvidia-container-runtime

docker_py3_pkgs:
  - docker
  - docker-compose
docker_repo_url: https://download.docker.com/linux
